[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-modal-rag-qa-chatbot"
version = "1.1.0"
description = "Multi-modal RAG QA chatbot with OpenAI / Azure OpenAI + Azure AI Search"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rag*"]

[tool.ruff]
target-version = "py39"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP", "S", "C4", "EXE"]
ignore = ["UP007", "UP045", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Optional third-party dependency gates behind try/except imports.
"src/rag/document_ingestion/enhanced_file_reader.py" = ["E402"]

[tool.mypy]
python_version = "3.9"
mypy_path = ["src", "."]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
exclude = ["tests", ".venv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"